<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiomedElectrónica | Unidad</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="main-header">
    <div class="header-content">
        <h1 class="logo">
            <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#2563eb"/>
                        <stop offset="50%" stop-color="#0891b2"/>
                        <stop offset="100%" stop-color="#10b981"/>
                    </linearGradient>
                </defs>
                <circle cx="50" cy="50" r="46" fill="none" stroke="url(#logoGrad)" stroke-width="4"/>
                <path d="M 15 50 L 30 50 L 35 35 L 42 65 L 48 42 L 54 58 L 60 50 L 85 50" 
                      fill="none" stroke="url(#logoGrad)" stroke-width="4" 
                      stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="30" cy="50" r="3" fill="#2563eb"/>
                <circle cx="70" cy="50" r="3" fill="#10b981"/>
            </svg>
            <div class="logo-text">
                <span class="line-1">Biomed</span>
                <span class="line-2">Electrónica</span>
            </div>
        </h1>
        <div class="user-info">
            <a href="dashboard.html" class="btn-back">← Volver al Panel</a>
            <a href="#" id="logout-btn" class="btn-logout">Cerrar Sesión</a>
        </div>
    </div>
</header>

    <main class="unit-main">
        <article id="unit-content">
            <div class="loading-spinner">Cargando contenido de la unidad...</div>
        </article>

        <!-- Sección del Cuestionario -->
        <section id="quiz-section" class="quiz-section" style="display:none;">
            <h3>Cuestionario de Autoevaluación</h3>
            <p>Responde las siguientes preguntas para poner a prueba tus conocimientos. Recibirás retroalimentación inmediata.</p>
            <form id="quiz-form">
                <div id="questions-wrapper"></div>
                <button type="submit" id="submit-quiz" class="btn-primary">Enviar Respuestas</button>
            </form>
            <div id="quiz-results" class="quiz-results"></div>
        </section>
    </main>

    <footer class="main-footer">
        <p>Ing. Angel Urdaneta</p>
    </footer>

    <script src="js/data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Verificación de sesión
            const user = localStorage.getItem('currentUser');
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const unidadId = urlParams.get('unidad');
            const contentContainer = document.getElementById('unit-content');
            const quizSection = document.getElementById('quiz-section');

            if (unidadId && contentData[unidadId]) {
                const unidad = contentData[unidadId];
                
                // Cargar contenido teórico
                contentContainer.innerHTML = unidad.content;
                
                // Cargar cuestionario
                if (unidad.quiz && unidad.quiz.length > 0) {
                    quizSection.style.display = 'block';
                    renderQuiz(unidad.quiz);
                }
            } else {
                contentContainer.innerHTML = '<h2>Unidad no encontrada</h2><p>Por favor, selecciona una unidad válida.</p>';
            }

            // --- Lógica del Cuestionario ---
            function renderQuiz(questions) {
                const questionsWrapper = document.getElementById('questions-wrapper');
                questionsWrapper.innerHTML = '';
                
                questions.forEach((q, index) => {
                    const questionDiv = document.createElement('div');
                    questionDiv.classList.add('question-block');
                    questionDiv.setAttribute('data-question-id', q.id);
                    
                    let optionsHTML = '';
                    q.options.forEach((opt, optIndex) => {
                        optionsHTML += `
                            <label class="option">
                                <input type="radio" name="q${q.id}" value="${optIndex}">
                                <span>${opt}</span>
                            </label>
                        `;
                    });

                    questionDiv.innerHTML = `
                        <p>${index + 1}. ${q.question}</p>
                        ${optionsHTML}
                        <div class="feedback" id="feedback-q${q.id}"></div>
                    `;
                    questionsWrapper.appendChild(questionDiv);
                });

                // Event listener para el envío
                document.getElementById('quiz-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    evaluateQuiz(questions);
                });
            }

            function evaluateQuiz(questions) {
                let score = 0;
                const totalQuestions = questions.length;

                questions.forEach(q => {
                    const selectedOption = document.querySelector(`input[name="q${q.id}"]:checked`);
                    const feedbackDiv = document.getElementById(`feedback-q${q.id}`);
                    
                    if (!selectedOption) {
                        feedbackDiv.textContent = "⚠ No has seleccionado una respuesta.";
                        feedbackDiv.className = 'feedback incorrect';
                        return;
                    }

                    const selectedValue = parseInt(selectedOption.value);
                    if (selectedValue === q.correct) {
                        score++;
                        feedbackDiv.textContent = "✔ ¡Correcto! " + q.feedback;
                        feedbackDiv.className = 'feedback correct';
                    } else {
                        feedbackDiv.textContent = "✘ Incorrecto. " + q.feedback;
                        feedbackDiv.className = 'feedback incorrect';
                    }
                });

                // Mostrar la puntuación final
                const scorePercentage = Math.round((score / totalQuestions) * 100);
                const resultsContainer = document.getElementById('quiz-results');
                resultsContainer.innerHTML = `
                    <h4>📊 Resultados del Cuestionario</h4>
                    <p>Has acertado <strong>${score}</strong> de <strong>${totalQuestions}</strong> preguntas.</p>
                    <p>Puntuación: <strong>${scorePercentage}%</strong></p>
                    ${scorePercentage >= 80 ? '<p style="color:#28a745;">¡Excelente trabajo! Has dominado esta unidad.</p>' : 
                      scorePercentage >= 60 ? '<p style="color:#ffc107;">Buen trabajo, pero repasa los conceptos fallados.</p>' :
                      '<p style="color:#dc3545;">Necesitas repasar esta unidad. Te recomendamos releer el contenido teórico.</p>'}
                `;

                // Deshabilitar el botón de envío y los inputs
                document.getElementById('submit-quiz').disabled = true;
                document.getElementById('submit-quiz').textContent = 'Cuestionario Enviado';
                document.querySelectorAll('#quiz-form input').forEach(input => input.disabled = true);
            }

            // --- Cierre de sesión ---
            document.getElementById('logout-btn').addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('currentUser');
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
