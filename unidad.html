<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiomedElectrónica | Unidad</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Estilos para bloques de código y diagramas -->
    <style>
        .diagram-container { text-align: center; margin: 2rem 0; }
        .diagram-container svg { max-width: 100%; height: auto; }
        .code-block {
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 1.5rem;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            border: 1px solid #30363d;
            margin: 1.5rem 0;
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <h1 class="logo">Biomed<span>Electrónica</span></h1>
            <div class="user-info">
                <a href="dashboard.html" class="btn-back">← Volver al Panel</a>
                <a href="#" id="logout-btn" class="btn-logout">Cerrar Sesión</a>
            </div>
        </div>
    </header>

    <main class="unit-main">
        <article id="unit-content">
            <!-- El contenido de la unidad se cargará aquí dinámicamente -->
            <div class="loading-spinner">Cargando contenido de la unidad...</div>
        </article>
    </main>

    <footer class="main-footer">
        <p>Ing. Angel Urdaneta</p>
    </footer>

    <script src="js/data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Verificación de sesión
            const user = localStorage.getItem('currentUser');
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const unidadId = urlParams.get('unidad');
            const contentContainer = document.getElementById('unit-content');

            if (unidadId && contentData[unidadId]) {
                contentContainer.innerHTML = contentData[unidadId];
            } else {
                contentContainer.innerHTML = '<h2>Unidad no encontrada</h2><p>Por favor, selecciona una unidad válida.</p>';
            }

            // Lógica de cierre de sesión
            document.getElementById('logout-btn').addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('currentUser');
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
