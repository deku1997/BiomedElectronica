<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiomedElectrónica | Ingreso</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1 class="logo">
                <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#2563eb"/>
                            <stop offset="50%" stop-color="#0891b2"/>
                            <stop offset="100%" stop-color="#10b981"/>
                        </linearGradient>
                    </defs>
                    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#logoGrad)" stroke-width="4"/>
                    <path d="M 15 50 L 30 50 L 35 35 L 42 65 L 48 42 L 54 58 L 60 50 L 85 50" 
                          fill="none" stroke="url(#logoGrad)" stroke-width="4" 
                          stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="30" cy="50" r="3" fill="#2563eb"/>
                    <circle cx="70" cy="50" r="3" fill="#10b981"/>
                    <circle cx="50" cy="18" r="3" fill="#0891b2"/>
                    <circle cx="50" cy="82" r="3" fill="#0891b2"/>
                    <line x1="50" y1="22" x2="50" y2="35" stroke="#0891b2" stroke-width="2" opacity="0.5"/>
                    <line x1="50" y1="65" x2="50" y2="78" stroke="#0891b2" stroke-width="2" opacity="0.5"/>
                </svg>
                <div class="logo-text">
                    <span class="line-1">Biomed</span>
                    <span class="line-2">Electrónica</span>
                </div>
            </h1>
            <div class="tabs">
                <button class="tab-btn active" data-tab="login">Iniciar Sesión</button>
                <button class="tab-btn" data-tab="register">Registrarse</button>
            </div>

            <!-- Formulario de Login -->
            <form id="login-form" class="auth-form active">
                <div class="input-group">
                    <label for="login-cedula">Cédula</label>
                    <input type="text" id="login-cedula" placeholder="Ingresa tu cédula" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
                <p class="message" id="login-message"></p>
            </form>

            <!-- Formulario de Registro -->
            <form id="register-form" class="auth-form">
                <div class="input-group">
                    <label for="reg-nombre">Nombres</label>
                    <input type="text" id="reg-nombre" placeholder="Tus nombres" required>
                </div>
                <div class="input-group">
                    <label for="reg-apellido">Apellidos</label>
                    <input type="text" id="reg-apellido" placeholder="Tus apellidos" required>
                </div>
                <div class="input-group">
                    <label for="reg-seccion">Sección</label>
                    <input type="text" id="reg-seccion" placeholder="Ej. A" required>
                </div>
                <div class="input-group">
                    <label for="reg-cedula">Cédula</label>
                    <input type="text" id="reg-cedula" placeholder="Ingresa tu cédula" required>
                </div>
                <div class="input-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" placeholder="Crea una contraseña" required>
                </div>
                <button type="submit" class="btn-primary">Registrarse</button>
                <p class="message" id="register-message"></p>
            </form>
        </div>
        <footer class="main-footer">
            <p>Ing. Angel Urdaneta</p>
        </footer>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
